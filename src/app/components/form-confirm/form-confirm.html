<mat-card appearance="raised">
  <mat-card-header>
    <mat-card-title>Удаление</mat-card-title>
  </mat-card-header>
  <mat-card-actions>
    <p class="buttons">
      <button (click)="ok(id)" matButton="tonal">OK</button>
      <button (click)="cancel()" matButton="tonal">Отмена</button>
    </p>
  </mat-card-actions>
</mat-card>
