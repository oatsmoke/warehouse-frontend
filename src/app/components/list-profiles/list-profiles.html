@switch (content()) {
  @case (State.List) {
    @if (profileItems && profileItems.length) {
      <app-table [columns]="profileColumns" [items]="profileItems" [options]="profileOption"/>
    } @else {
      <app-form-empty/>
    }
  }
  @case (State.Create) {
    <app-form-profile (relist)="list()"/>
  }
  @case (State.Update) {
    <app-form-profile (relist)="list()" [profile]="profile"/>
  }
  @case (State.Confirm) {
    <app-form-confirm (confirm)="delete($event)" [id]="id"/>
  }
}
