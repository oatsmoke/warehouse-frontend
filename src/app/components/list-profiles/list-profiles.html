@switch (content()) {
  @case (State.List) {
    @if (profileItems.length > 0) {
      <app-table [columns]="profileColumns" [items]="profileItems" [options]="profileOption"/>
    }@else{
      <app-form-empty/>
    }
  }
  @case (State.Create) {
    <app-form-profile/>
  }
  @case (State.Update) {
    <app-form-profile [profile]="profile"/>
  }
  @case (State.Confirm) {
    <app-form-confirm (confirm)="delete($event)" [id]="id"/>
  }
}
