<button [matMenuTriggerFor]="menu" class="main-button" matButton="elevated">
  <mat-icon>keyboard_arrow_down</mat-icon>
  {{ department() }}
</button>
<mat-menu #menu="matMenu">
  <button [disabled]="id=='0'" [routerLink]="['/equipment', 'department', '0']" mat-menu-item>Склад</button>
  @for (item of items; track item) {
    <button [disabled]="String(item.id)==id" [routerLink]="['/equipment', 'department', item.id]" mat-menu-item>
      {{ item.title }}
    </button>
  }
</mat-menu>
