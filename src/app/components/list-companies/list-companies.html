@switch (content()) {
  @case (State.List) {
    @if (companyItems.length > 0) {
      <app-table [columns]="companyColumns" [items]="companyItems" [options]="companyOption"/>
    }@else{
      <app-form-empty/>
    }
  }
  @case (State.Create) {
    <app-form-company/>
  }
  @case (State.Update) {
    <app-form-company [company]="company"/>
  }
  @case (State.Confirm) {
    <app-form-confirm (confirm)="delete($event)" [id]="id"/>
  }
}
