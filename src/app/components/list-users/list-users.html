@switch (content()) {
  @case (State.List) {
    @if (userItems && userItems.length) {
      <app-table [columns]="userColumns" [items]="userItems" [options]="userOption"/>
    } @else {
      <app-form-empty/>
    }
  }
  @case (State.Create) {
    <app-form-user (relist)="list()"/>
  }
  @case (State.Update) {
    <app-form-user (relist)="list()" [user]="user"/>
  }
  @case (State.Confirm) {
    <app-form-confirm (confirm)="delete($event)" [id]="id"/>
  }
}
