@switch (content()) {
  @case (State.List) {
    @if (categoryItems.length > 0) {
      <app-table [columns]="categoryColumns" [items]="categoryItems" [options]="categoryOption"/>
    }
  }
  @case (State.Create) {
    <app-form-category/>
  }
  @case (State.Update) {
    <app-form-category [category]="category"/>
  }
  @case (State.Confirm) {
    <app-form-confirm [id]="id" (confirm)="delete($event)"/>
  }
}
